name: Cordova iOS Podfile compatibility

on:
  pull_request:
    branches: [dev, 'dev[0-9]*', master]
    paths:
      - '.github/workflows/cordova-ios-podfile.yaml'
      - 'tools/**'
      - 'package.json'
      - 'plugin.xml'
  push:
    branches: [dev, 'dev[0-9]*', master]
    paths:
      - '.github/workflows/cordova-ios-podfile.yaml'
      - 'tools/**'
      - 'package.json'
      - 'plugin.xml'
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number containing the parser test suite
        required: true
        type: number
      expected_head:
        description: Full reviewed commit SHA of that pull request
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pull_request) || github.sha }}
      - name: Verify requested PR head
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_HEAD: ${{ inputs.expected_head }}
        run: |
          actual_head=$(git rev-parse HEAD)
          test "$actual_head" = "$EXPECTED_HEAD"
          echo "Verified requested PR revision."
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.2'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Test the real Cordova parser
        run: npm test

  ci-provenance:
    name: CI provenance
    if: always()
    needs: ["test"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record GitHub execution context
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTED_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          fields = {
              'repository': 'REPOSITORY', 'repository_id': 'REPOSITORY_ID',
              'run_id': 'RUN_ID', 'run_attempt': 'RUN_ATTEMPT', 'event': 'EVENT',
              'workflow_sha': 'WORKFLOW_SHA', 'sha': 'EXECUTED_SHA',
              'pr': 'PR_NUMBER', 'head_sha': 'HEAD_SHA',
              'head_repository_id': 'HEAD_REPOSITORY_ID',
              'base_sha': 'BASE_SHA', 'base_ref': 'BASE_REF',
          }
          value = {key: os.environ[env] for key, env in fields.items()}
          value['workflow_path'] = '.github/workflows/cordova-ios-podfile.yaml'
          with open('provenance.json', 'w') as output:
              json.dump(value, output, sort_keys=True)
          PYTHON
      - name: Upload provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
